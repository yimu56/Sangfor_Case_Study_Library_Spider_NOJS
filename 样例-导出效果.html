<script id="sfc-data" type="application/json">[{"t":"【aTrust】客户端安装失败，提示atrustagent.exe无法停止","p":"零信任访问控制系统aTrust","m":"windows_客户端安装失败","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-07-21 23:08:47","id":"2:3467","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=3467&isOpen=true","h":"<div><div class=\"mceNonEditable problem-description-box\"><h3>问题描述——<\/h3> <div class=\"problem-description\"><div style=\"text-align: left\"><div style=\"text-align: left\">客户端安装失败，提示atrustagent.exe无法停止<\/div><img id=\"aimg_zO873\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1660012229.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n<br>\n<\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>有效排查步骤——<\/h3> <div><div style=\"text-align: left\"><div style=\"text-align: left\">1、测试任务管理器和cmd杀进程都是无法停止进程<br>\n<img id=\"aimg_UKlv4\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1659337352.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n2、重启电脑也不行<div style=\"text-align: left\">3、查看设备系统启动时间很长，接近四天多<\/div><img id=\"aimg_i48Rg\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1659337412.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n4、判断因为快速启动功能，导致程序在电脑关机后挂起，再次开机后无法唤醒，同时因为无法杀掉导致问题出现<br>\n<img id=\"aimg_B2oRH\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1659337487.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n<br>\n<\/div><\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>告警信息——<\/h3> <div>&nbsp;<\/div><\/div><div class=\"mceNonEditable\"><h3>处理过程——<\/h3> <div>&nbsp;<\/div><\/div><div class=\"mceNonEditable\"><h3>根因——<\/h3> <div>&nbsp;<\/div><\/div><div class=\"mceNonEditable problem-description-box\"><h3>解决方案——<\/h3> <div class=\"problem-description\"><div style=\"text-align: left\"><div style=\"text-align: left\">关闭电脑快速关机启动，然后重启电脑重新安装<br>\n<img id=\"aimg_sSLVS\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1659337524.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n<br>\n<\/div><\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>操作影响范围——<\/h3> <div><div style=\"text-align: left\"><div style=\"text-align: left\">无<\/div><\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>建议与总结——<\/h3> <div>&nbsp;<\/div><\/div><\/div>","img":5},{"t":"【aTrust】因aTrustDnsDriverInstaller.exe执行超时导致SdpNetFilter1.sys驱动未安装，客户端隧道不可用，所有资源访问失败","p":"零信任访问控制系统aTrust","m":"windows_客户端安装失败","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-08-10 21:32:45","id":"2:45233","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=45233&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>部分终端访问所有资源失败，隧道tunnelUnavailable。因aTrustDnsDriverInstaller.exe执行超时，缺失SdpNetFilter1.sys驱动，xtunnel加载驱动失败，报错“open netflt failed, err:code: 2, msg:系统找不到指定的文件”。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>open netflt failed, err:code: 2, msg:系统找不到指定的文件<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：aTrust2.4.10<\/li>\n<li>架构：通用架构<\/li>\n<li>部署模式：无关<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<ol>\n<li>查看aTrustCore日志，确认隧道状态是否为tunnelUnavailable。<ul>\n<li>命令/路径：findstr /I \"tunnelStatus\" \"C:\\Program Files (x86)\\Sangfor\\aTrust\\logs\\aTrustCore.log\"<\/li>\n<li>预期结果：隧道状态应为可用，若输出包含tunnelUnavailable则说明隧道不可用。<\/li>\n<li>判断依据：aTrustCore日志记录tunnelStatus为tunnelUnavailable，所有隧道访问日志0字节。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>查看xtunnel.log，检查是否存在netflt驱动加载失败的报错。<ul>\n<li>命令/路径：findstr /I \"open netflt\" \"C:\\Program Files (x86)\\Sangfor\\aTrust\\logs\\xtunnel.log\"<\/li>\n<li>预期结果：应无open netflt failed错误；若存在则说明驱动加载异常。<\/li>\n<li>判断依据：xtunnel.log记录698次“init modules failed”，报错“open netflt failed, err:code: 2, msg:系统找不到指定的文件”。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>查看system_info.log或驱动文件目录，确认SdpNetFilter1.sys是否存在。<ul>\n<li>命令/路径：findstr /I \"SdpNetFilter\" \"C:\\Program Files (x86)\\Sangfor\\aTrust\\logs\\system_info.log\" 或 dir \"C:\\Program Files (x86)\\Sangfor\\aTrust*SdpNetFilter*.sys\"<\/li>\n<li>预期结果：驱动文件列表中应存在SdpNetFilter1.sys；若缺失则说明驱动未安装。<\/li>\n<li>判断依据：system_info.log仅含SdpNetFilter0.sys，缺少SdpNetFilter1.sys。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>查看aTrustInstaller.log，检查驱动安装器执行是否超时。<ul>\n<li>命令/路径：findstr /I \"timeout\" \"C:\\Program Files (x86)\\Sangfor\\aTrust\\logs\\aTrustInstaller.log\"<\/li>\n<li>预期结果：aTrustDnsDriverInstaller.exe执行应正常返回，不应出现timeout。<\/li>\n<li>判断依据：aTrustInstaller.log记录ExecToStack aTrustDnsDriverInstaller.exe return:timeout，表明驱动安装超时。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>aTrustDnsDriverInstaller.exe执行超时，SdpNetFilter1.sys未成功安装，xtunnel加载驱动失败，隧道不可用，导致所有资源访问失败。日志佐证：aTrustInstaller.log记录return:timeout，system_info.log缺少SdpNetFilter1.sys，xtunnel.log反复报错open netflt failed。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：已确认SdpNetFilter1.sys驱动文件缺失，需要重新安装aTrust客户端以使驱动正确安装。<\/li>\n<li>是否后台操作：否<\/li>\n<li>操作步骤：\n<ol>\n<li>卸载当前aTrust客户端。<\/li>\n<li>重新安装最新版aTrust客户端。<\/li>\n<li>安装后检查安装日志目录下SdpNetFilter1.sys是否正常生成。<\/li>\n<li>启动客户端，验证所有资源访问恢复。<\/li>\n<\/ol>\n<\/li>\n<li>验证方案：重装后，system_info.log包含SdpNetFilter1.sys，xtunnel.log无open netflt failed报错，隧道可用，所有资源访问正常。<\/li>\n<li>操作影响：重新安装客户端期间，该终端将无法访问资源，影响范围为单机。<\/li>\n<\/ul>\n<\/div>\n<\/div>","img":0},{"t":"【aTrust】安装aTrust2.2.10信创镜像卡住，无法进入系统","p":"零信任访问控制系统aTrust","m":"私有云虚拟化部署_私有云虚拟化部署异常","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-07-21 23:08:47","id":"2:3675","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=3675&isOpen=true","h":"<div><div class=\"mceNonEditable problem-description-box\"><h3>问题描述——<\/h3> <div class=\"problem-description\"><div style=\"text-align: left\"><font style=\"color:#000\"><font style=\"font-family:微软雅黑\"><font size=\"3\">海光服务器，超融合681，安装atrust2.2.10信创镜像卡住，无法进入系统<\/font><\/font><\/font><\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>告警信息——<\/h3> <div><div style=\"text-align: left\"><br>\n<img id=\"aimg_TMzo2\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1675754945.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n<\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>有效排查步骤——<\/h3> <div><div style=\"text-align: left\">1、镜像获取没有问题<div style=\"text-align: left\"><img id=\"aimg_iKcKs\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1675755047.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n2、查看<font style=\"color:#000\"><font style=\"font-family:PingFangSC-Regular, &amp;quot\"><font style=\"font-size:14px\">BIOS启动方式默认为SeaBIOS<\/font><\/font><\/font><\/div><div style=\"text-align: left\"><img id=\"aimg_ak4CW\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1675755078.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n3、<font style=\"font-family:微软雅黑\">将其改成<font style=\"color:#000\"><font style=\"font-size:14px\">UEFI启动，aTrust镜像导入安装正常<\/font><\/font><\/font><\/div><\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>处理过程——<\/h3> <div>&nbsp;<\/div><\/div><div class=\"mceNonEditable\"><h3>根因——<\/h3> <div><div style=\"text-align: left\"><font style=\"color:#000\"><font style=\"font-family:微软雅黑\"><font size=\"3\">BIOS启动方式默认为SeaBIOS，需要修改成UEFI。<\/font><\/font><\/font><\/div><\/div><\/div><div class=\"mceNonEditable problem-description-box\"><h3>解决方案——<\/h3> <div class=\"problem-description\"><div style=\"text-align: left\"><font style=\"color:#000\"><font style=\"font-family:微软雅黑\"><font size=\"3\">BIOS启动方式默认为SeaBIOS，修改成UEFI启动。<\/font><\/font><\/font><\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>操作影响范围——<\/h3> <div><div style=\"text-align: left\">无<\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>是否是临时解决方案——<\/h3> <div><div style=\"text-align: left\">否<\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>建议与总结——<\/h3> <div>&nbsp;<\/div><\/div><\/div>","img":3},{"t":"【aTrust】因WiFi DNS服务器拒绝atrustapp.sangfor.com域名查询，导致鸿蒙手机应用封装app下载失败，提示“Manifest download fail”","p":"零信任访问控制系统aTrust","m":"移动端数据安全_移动封装app使用异常","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-08-02 15:53:43","id":"2:43823","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=43823&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>鸿蒙手机使用aTrust封装app下载时报错\"Manifest download fail\"，原因为域名atrustapp.sangfor.com解析失败。问题仅在特定WiFi下复现，移动数据下正常，涉及应用封装模块与鸿蒙企业应用安装器。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>Manifest download fail<br>ERR_NAME_NOT_RESOLVED（域名 atrustapp.sangfor.com 解析失败）<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：aTrust2.5.16<\/li>\n<li>架构：通用架构<\/li>\n<li>部署模式：无关<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<ol>\n<li>使用另一台设备在同一WiFi网络下下载同一应用封装app，验证问题是否仅在单台设备上复现。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：其他设备可正常下载，问题设备必现。<\/li>\n<li>判断依据：另一台设备下载正常，问题设备必现。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>导出零信任app日志分析，检查鸿蒙系统企业应用安装器与本地HTTPS服务的连接状态及SDK调用时间线。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：日志应显示安装器未连接本地HTTPS服务，SDK调用openLink后快速回前台，安装超时。<\/li>\n<li>判断依据：日志显示鸿蒙企业应用安装器未连接本地HTTPS服务，SDK调用openLink后0.45秒回前台，安装超时报错\"安装超时\"。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>在问题手机上使用DNS解析工具验证域名atrustapp.sangfor.com的解析结果。<ul>\n<li>命令/路径：通过DevEco Studio的hdc shell执行ping atrustapp.sangfor.com<\/li>\n<li>预期结果：域名应解析到正确的公网IP地址。<\/li>\n<li>判断依据：ping结果解析到127.0.0.1，域名解析异常。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>对问题WiFi网络下的DNS查询行为进行分析，确认DNS服务器是否拒绝该域名查询。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：诊断结果应指向DNS服务器拒绝查询。<\/li>\n<li>判断依据：华为远程诊断发现DNS查询被服务器拒绝。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"5\">\n<li>切换至移动数据网络，重新下载应用封装app，验证域名解析及下载功能是否恢复。<ul>\n<li>命令/路径：【第三方操作：以第三方设备实际情况为准】<\/li>\n<li>预期结果：使用移动数据网络下载正常。<\/li>\n<li>判断依据：流量下载正常，原WiFi仍有问题，确认根因为WiFi DNS服务器拒绝查询。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>所在WiFi的DNS服务器拒绝域名atrustapp.sangfor.com的查询，导致解析错误为127.0.0.1，鸿蒙企业应用安装器无法下载manifest文件，最终报错\"Manifest download fail\"。华为远程诊断确认DNS查询被拒绝；ping返回127.0.0.1；切换移动网络正常，反向印证根因。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：确认问题仅发生在特定WiFi网络下，移动数据网络可正常使用。<\/li>\n<li>是否后台操作：否<\/li>\n<li>操作步骤：\n<ol>\n<li>退出当前WiFi。<ul>\n<li>影响说明：【第三方操作：以第三方设备实际情况为准】<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>开启移动数据。<ul>\n<li>影响说明：【第三方操作：以第三方设备实际情况为准】<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>重新打开应用商店或下载页面，尝试下载封装app。<ul>\n<li>影响说明：无<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>验证下载成功，无\"Manifest download fail\"报错。<ul>\n<li>影响说明：无<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"5\">\n<li>若需在原WiFi使用，修改DNS为公共DNS（如8.xx）。<ul>\n<li>影响说明：【高危操作】修改DNS配置前需确认网络管理员授权，修改后需验证其他内网域名解析是否正常。【第三方操作：以第三方设备实际情况为准】<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/li>\n<li>验证方案：切换移动网络后下载成功，无报错；多个WiFi测试部分正常部分失败，确认根因为特定WiFi DNS问题。<\/li>\n<li>操作影响：切换网络后下载正常，原问题WiFi网络下下载仍失败，基本功能不受影响。若修改WiFi DNS服务器配置，可能影响该网络下其他设备的域名解析行为。<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>补充说明<\/h3> \n<ul>\n<li>本案例根因为第三方WiFi DNS服务器配置问题，非aTrust产品自身缺陷。<\/li>\n<li>域名atrustapp.sangfor.com是深信服应用封装服务的核心域名，用于下载manifest文件和封装应用资源，使用过程中需确保终端可正常解析该域名。<\/li>\n<li>鸿蒙系统企业应用安装器在下载manifest文件时依赖系统DNS解析，解析失败会直接导致安装超时报错。<\/li>\n<\/ul>\n<\/div>\n<\/div>","img":0},{"t":"【aTrust】aTrust2.2.72因app分区满，引发HTTPS认证失败，提示“获取关键信息失败”","p":"零信任访问控制系统aTrust","m":"认证管理,设备系统问题","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-08-02 22:55:00","id":"2:44046","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=44046&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>aTrust2.2.72集群中，由于hids没有指定临时数据的生成目录，导致临时数据未被正常清理app分区使用率100%，进而导致HTTPS证书加载及认证信息获取失败，登录页面提示“获取关键信息失败”。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>用户登录页面提示：获取关键信息失败。<span>&nbsp;<\/span><\/p>\n<p>。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：aTrust2.2.72<\/li>\n<li>架构：集群部署<\/li>\n<li>部署模式：集群部署<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>1.确认用户登录失败的具体表现及报错信息：页面提示“获取关键信息失败”，无法正常进入门户或访问应用。<\/p>\n<p>2.日志/hislog/log/sdp-data-service-console/sdp-data-service-console-web.log 中出现磁盘写入失败或空间不足相关报错：<span>no space left on device。<\/span><span>&nbsp;<\/span>登录控制台后台检查app分区磁盘使用率，确认是否已满。命令/路径：<code>df -h | grep /app<\/code><\/p>\n<ol start=\"3\">\n<li><span>如果<code>/app磁盘目录满了，<\/code>查看目录（<\/span><span>/app/native-app/<\/span><span>）<\/span><span>各目录的空间占用情况，命令：cd /app/native-app/ &amp;&amp; du -sh *，正常来说hids目录占用的目录在100M以下<\/span>。<\/li>\n<li><span>如果hids目录占用不符合预期，继续确认是哪些文件占用的磁盘空间，执行下述两个命令进行确认，<\/span>\n<ul>\n<li><span>命令1：cd /app/native-app/hids/data/report/cur | du -sh * | sort -hr，查看各文件从大到小的占用空间排序<\/span><\/li>\n<li><span>命令2：cd /app/native-app/<span>hids/data/report/cur | ls，列出目录（/app/native-app/hids/data/report/cur）下所有的文件<\/span><\/span><\/li>\n<\/ul>\n<ul>\n<li>预期结果：<span>如果目录（/app/native-app/hids/data/report/cur）下存在很多压缩文件（正常来说应该是没有压缩文件，或者目录不存在），那么就可以确认是该问题导致的<\/span>。<\/li>\n<li>判断依据：<span>如果如上两点同时满足，就可以确认是该问题导致的<code>/app磁盘目录满了<\/code><\/span><\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p><span>由于hids没有指定临时数据的生成目录，导致临时数据未被正常清理，从而导致/app分区占满<\/span>，磁盘满后HTTPS证书及认证信息无法读取，导致登录页面提示“获取关键信息失败”。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：已确认app分区满由hids临时文件引起，具备SSH后台操作及修改hids配置的权限。<\/li>\n<li>是否后台操作：是<\/li>\n<li>操作步骤：\n<ol>\n<li>临时解决办法\n<ul>\n<li>手动清理对应目录下的残留文件，命令：<span>cd /app/native-app/<\/span><span>hids/data/report/cur &amp;&amp; rm -rf *<\/span><\/li>\n<\/ul>\n<\/li>\n<li><span>彻底解决办法：<\/span>\n<ul>\n<li><span>补丁包方案，如果是2216或者2310版本，实施补丁包<span>SP_aTrust_DFXImprove即可<\/span><\/span><span><span><br><\/span><\/span><\/li>\n<li><span><span>升级方案，2410正式发布版已经解决该问题，升级到2410正式发布版本即可<\/span><\/span><\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<\/li>\n<li>验证方案：清理指定hids临时目录后，app分区使用率低于90%，登录页面正常，不再报“获取关键信息失败”。<\/li>\n<li>操作影响：临时清理文件操作可能会导致hids部分扫描进度丢失，不影响业务数据。指定临时目录并重启hids服务不影响用户正常接入流量。<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>补充说明<\/h3> \n<ul>\n<li>若生产环境紧急需恢复业务，可先手动清理部分无用的临时日志文件，再评估升级版本<\/li>\n<\/ul>\n<\/div>\n<\/div>","img":0},{"t":"【aTrust】aTrust2.4.10版本鸿蒙企微H5 iframe嵌套场景下WEB资源访问白屏","p":"零信任访问控制系统aTrust","m":"认证管理,应用管理","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-09-13 22:17:25","id":"2:48687","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=48687&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>纯血鸿蒙手机经企业微信H5访问aTrust发布的泛微移动管理平台及OA-WPS预览资源时白屏，浏览器直连正常。aTrust服务端版本2.4.10，升级至2.5.16并统一HTTPS后恢复。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>企业微信H5打开WEB资源白屏；页面提示：ERR_SSL_PROTOCOL_ERROR 此站点的连接不安全（&lt;业务系统域名&gt; 发送了无效的响应）<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：aTrust2.4.10<\/li>\n<li>架构：通用架构<\/li>\n<li>部署模式：无<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<ol>\n<li>在纯血鸿蒙手机通过企业微信H5访问WEB资源，对比使用浏览器直接打开同一资源。<ul>\n<li>命令/路径：企业微信中打开H5应用；浏览器直接访问同一URL<\/li>\n<li>预期结果：企业微信H5打开白屏，浏览器直接打开显示正常。<\/li>\n<li>判断依据：两个WEB资源经企业微信H5打开白屏，浏览器直连正常，问题定位在企业微信H5入口，aTrust侧基本正常。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>确认复现终端与服务端版本，区分纯血鸿蒙与普通鸿蒙。<ul>\n<li>命令/路径：手机设置→关于手机查看系统版本；aTrust控制台【系统管理】→【升级管理】→【系统升级】查看当前版本。<\/li>\n<li>预期结果：纯血鸿蒙可复现，普通鸿蒙不复现，服务端为2.4.10版本。<\/li>\n<li>判断依据：异常仅存于纯血鸿蒙手机，普通鸿蒙无此问题，2.4.10版本对纯血鸿蒙终端识别有误。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>实施SP_aTrust_WebRes2516_01通用包并调整代理网关配置后，观察是否仍有问题。<ul>\n<li>命令/路径：aTrust控制台【系统管理】→【升级管理】→【补丁升级】上传并安装通用包；后台调整配置（具体命令见补丁包说明）[待确认]<\/li>\n<li>预期结果：升级后问题应被修复，但有用户反馈仍无法访问，说明存在其他因素。<\/li>\n<li>判断依据：仍有失败，需抓包继续定位。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>使用Fiddler在纯血鸿蒙手机抓包，导出HAR请求分析。<ul>\n<li>命令/路径：手机设置代理指向Fiddler所在电脑，抓取WPS访问时的HAR请求<\/li>\n<li>预期结果：获取WPS访问时的HAR请求，可观察cookie携带情况和上下行协议。<\/li>\n<li>判断依据：抓包发现两个业务协议不一致（http与https），触发鸿蒙企微内置浏览器安全策略，导致WPS访问时cookie无法携带。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"5\">\n<li>协调第三方业务团队将零信任和企业微信统一改为https并完成证书配置后，重新在纯血鸿蒙手机上复测。<ul>\n<li>命令/路径：【第三方操作：以第三方设备实际情况为准】<\/li>\n<li>预期结果：纯血鸿蒙用户通过企业微信H5恢复正常预览，白屏消失。<\/li>\n<li>判断依据：切换HTTPS后鸿蒙用户正常预览，问题解决。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>aTrust 2.4.10在纯血鸿蒙企业微信内置浏览器iframe嵌套场景下，子站点无法携带上层认证信息，且业务协议http与https混用，触发浏览器安全策略，导致cookie携带失败与鉴权异常，最终WEB资源白屏。安装SP_aTrust_WebRes2516_01通用包并将零信任与企业微信统一为HTTPS后恢复正常。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：已协调第三方业务系统配合处理HTTPS证书；已获取SP_aTrust_WebRes2516_01通用包；建议低峰期执行升级并通知在线用户。<\/li>\n<li>是否后台操作：是<\/li>\n<li>操作步骤：\n<ol>\n<li>aTrust控制台【系统管理】→【升级管理】→【补丁升级】上传并安装SP_aTrust_WebRes2516_01通用包。<ul>\n<li>影响说明：升级期间H5访问可能短暂中断，在线用户如需验证需注销后重新登录。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>代理网关后台执行配置调整命令，下发aTrust认证信息至泛域名下（具体命令见SP_aTrust_WebRes2516_01通用包说明）[待确认]<ul>\n<li>影响说明：后台调整配置期间在线用户可能受影响，调整后需注销在线测试用户再重新访问验证。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>aTrust控制台【监控中心】→【用户监控】→【在线用户】手动注销测试用户。<ul>\n<li>影响说明：注销后用户需重新登录。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>协调第三方业务团队将零信任与企业微信/泛微OA统一使用HTTPS并完成证书配置。【第三方操作：以第三方设备实际情况为准】<ul>\n<li>影响说明：证书配置错误时页面会提示ERR_SSL_PROTOCOL_ERROR。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"5\">\n<li>纯血鸿蒙手机经企业微信H5重新访问泛微移动管理平台及OA-WPS预览，白屏消失，业务内容正常显示。<ul>\n<li>影响说明：无<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/li>\n<li>验证方案：切换HTTPS后鸿蒙用户预览正常；纯血鸿蒙手机经企业微信H5访问两个WEB资源恢复正常，白屏问题消失。<\/li>\n<li>操作影响：升级和后台调整期间需将在线用户注销后重新访问验证，业务侧证书错误时页面会提示ERR_SSL_PROTOCOL_ERROR。<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>补充说明<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>此问题涉及鸿蒙企微内置浏览器的安全策略限制，后续版本已优化对纯血鸿蒙的识别。<\/p>\n<\/div>\n<\/div>\n<\/div>","img":0},{"t":"【aTrust】aTrust2.5.16 NAT集群从节点默认路由指向集群IP被巡检工具误报为异常","p":"零信任访问控制系统aTrust","m":"系统管理","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-08-31 17:48:01","id":"2:45428","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=45428&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>aTrust综合网关NAT集群环境下，巡检工具将从节点默认路由指向集群IP误报为异常。该路由为NAT集群正常设计，用于保证NAT会话一致性，业务上网无影响。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>设备提示后台路由有条默认路由去172.xx（此ip是集群ip）；巡检报告将默认路由指向集群IP判定为异常<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：aTrust2.5.16<\/li>\n<li>架构：通用架构<\/li>\n<li>部署模式：集群部署<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<ol>\n<li>查看集群管理页面，确认主从节点IP及集群模式。<ul>\n<li>命令/路径：打开【系统管理】-【集群管理】-【本地集群】<\/li>\n<li>预期结果：可看到主节点IP 172.xx，从节点IP 172.xx，集群模式为NAT。<\/li>\n<li>判断依据：集群配置信息显示主节点172.xx、从节点172.xx，确认NAT集群模式部署。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>在Web界面手动写入默认路由指向网关（172.xx），观察默认路由是否变化。<ul>\n<li>命令/路径：打开【系统管理】-【网络部署】-【路由设置】，添加默认路由下一跳172.xx。<\/li>\n<li>预期结果：手动设置的默认路由应生效，但实际默认路由仍指向集群IP。<\/li>\n<li>判断依据：手动写入默认路由后，查看路由表发现默认路由仍指向VIP（172.xx），表明默认路由被集群机制锁定。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>登录设备后台删除默认路由并手动添加指向172.xx网关的路由，再回到页面保存配置，观察默认路由变化。【高危操作】删除默认路由可能短暂影响节点网络。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：后台手动添加的路由应生效，但页面保存后默认路由再次变为集群IP。<\/li>\n<li>判断依据：页面保存后默认路由再次变为172.xx，说明集群模式会自动恢复指向集群IP的默认路由。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>在后台执行命令查看实际路由表及上网路径。<ul>\n<li>命令/路径：route -n<br>ip route get 8.xx<\/li>\n<li>预期结果：从节点（10.xx）默认路由为 via 172.xx dev eth1，上网路径经集群IP转发。<\/li>\n<li>判断依据：10.xx节点执行<code>ip route<\/code>显示<code>default via 172.xx dev eth1 proto static<\/code>，<code>ip route get 8.xx<\/code>显示<code>8.xx via 172.xx<\/code>，确认默认路由指向集群VIP。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"5\">\n<li>与内部专家确认aTrust综合网关NAT集群模式下从节点默认路由的机制。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：确认从节点默认路由指向集群IP为正常设计，用于保证NAT会话一致性。<\/li>\n<li>判断依据：内部专家明确该路由为NAT集群正常设计，巡检报告系误报。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>由于aTrust综合网关控制中心采用NAT集群模式，从节点回包需经集群IP（172.xx）转发至主节点以保证NAT会话一致性，导致从节点存在指向集群IP的默认路由。该路由属于正常设计，业务不受影响，但巡检工具无法识别这一机制，将其误报为异常路由。<br>内部专家确认：从节点处理业务请求后，回包流量需先到达集群IP（172.xx），再通过主节点完成后续转发，以确保NAT状态及业务路径的一致性，因此从节点默认路由指向集群VIP属于正常设计，非故障。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：已确认从节点默认路由指向集群IP属于正常设计，业务上网正常；已与现场沟通并达成共识。<\/li>\n<li>是否后台操作：否<\/li>\n<li>操作步骤：\n<ol>\n<li>登录从节点后台执行<code>route -n<\/code>，确认默认路由仍指向集群IP 172.xx，且测试上网正常。<\/li>\n<li>向现场说明该路由为aTrust NAT集群正常转发机制，巡检报告为误报，无需修改路由配置。<\/li>\n<li>若巡检平台支持忽略规则，将该默认路由加入白名单以避免后续误报。<\/li>\n<li>关注社区平台巡检误报问题的修复进展，待修复后更新巡检规则或升级工具。<\/li>\n<\/ol>\n<\/li>\n<li>验证方案：从节点（10.xx）重启后默认路由仍指向172.xx且上网正常；现场确认无需处理，巡检不再误报（或已加入白名单）。<\/li>\n<li>操作影响：无业务影响，该路由为集群正常设计，直接忽略即可。<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>补充说明<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>NAT集群模式下，从节点通过集群IP将回包转发至主节点，是保证主节点统一处理NAT会话和业务流量路径的标准机制，因此从节点默认路由指向集群IP属于预期行为。<\/p>\n<\/div>\n<\/div>\n<\/div>","img":0},{"t":"【aTrust】因Linux平台无用户登录会话，导致aTrustCore进程无法启动，SDK返回错误码20002","p":"零信任访问控制系统aTrust","m":"终端接入相关","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-08-02 14:17:39","id":"2:43805","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=43805&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>第三方软件通过SDK调用aTrust客户端返回错误码20002，涉及Linux平台aTrustCore进程、aTrustAgent服务及SDK通信模块，触发于无用户登录会话（系统重启未登录或用户注销后）。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>SDK返回错误码：ATRUST_CONNECT_ERROR(20002)。日志中aTrustCore进程启动失败，getCurrentUserNameByPopen()函数返回失败；aTrustTunnel插件日志出现\"Connect to the RPC server...failure\"。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：所有版本通用<\/li>\n<li>架构：通用架构<\/li>\n<li>部署模式：无关<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<ol>\n<li>检查aTrustAgent和aTrustCore进程是否正常运行。<ul>\n<li>命令/路径：ps -aux | grep aTrustAgent<\/li>\n<li>预期结果：应存在两个aTrustAgent进程：一个带daemon参数的守护进程，另一个带plugins/aTrustCore参数的核心服务进程。<\/li>\n<li>判断依据：aTrustTray和aTrustAgent进程正常，aTrustCore进程未启动。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>收集aTrust客户端日志和SDK日志，检查启动失败和连接错误记录。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：日志中应包含getCurrentUserNameByPopen()失败记录和\"Connect to the RPC server...failure\"错误。<\/li>\n<li>判断依据：日志显示aTrustCore启动依赖用户登录会话，无登录时getCurrentUserNameByPopen()失败。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>分析日志确认aTrustCore未启动是否因无用户登录所致，检查本地HTTP服务端口可用性。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：确认aTrustCore未启动是SDK返回20002的直接原因，本地HTTP服务端口（54630/54641/54652）不可用。<\/li>\n<li>判断依据：aTrustCore未启动导致HTTP端口不可用，SDK在precheck()中findLocalPort()探测全部失败，返回20002。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>aTrustCore进程启动依赖getCurrentUserNameByPopen()获取登录用户，无用户登录时函数失败，进程无法启动，导致HTTP端口（54630/54641/54652）不可用，SDK探测端口失败返回20002。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：第三方软件在Linux平台调用aTrust SDK，且出现返回码20002。<\/li>\n<li>是否后台操作：否<\/li>\n<li>操作步骤：\n<ol>\n<li>方案一：调用SDK前检查aTrustCore进程及HTTP端口。执行ps -aux | grep 'plugins/aTrustCore'；进程存在则等待2秒后执行netstat -tlnp | grep -E '54630|54641|54652'。<\/li>\n<li>确认进程和端口就绪后调用SDK接口。<\/li>\n<li>方案二：SDK返回20002时等待5-10秒后重试，设置3-5次重试次数。<\/li>\n<li>备选方案：调整第三方软件调用时机，确保用户已登录。<\/li>\n<\/ol>\n<\/li>\n<li>验证方案：方案一实施后，SDK调用成功，不再返回20002。方案二重试期间建立连接。备选方案在登录后调用正常。<\/li>\n<li>操作影响：方案一需要修改第三方软件调用前置检查逻辑；方案二增加重试逻辑，延迟5-10秒；备选方案需调整调用时机，不影响aTrust原有功能。<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>补充说明<\/h3> \n<ul>\n<li>aTrustCore进程是aTrustAgent插件，负责提供本地HTTP服务供SDK调用（监听54630/54641/54652端口），其启动依赖getCurrentUserNameByPopen()获取登录用户以设置低权限运行。<\/li>\n<li>若系统仅运行后台服务而无图形登录会话，可通过虚拟登录或配置systemd服务保证aTrustCore始终运行。<\/li>\n<\/ul>\n<\/div>\n<\/div>","img":0},{"t":"【aTrust】即刻PDF阅读器导致安装客户端提示安装失败“aTrustAgent安装异常”","p":"零信任访问控制系统aTrust","m":"windows_客户端安装失败","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-07-21 23:08:47","id":"2:2950","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=2950&isOpen=true","h":"<div><div class=\"mceNonEditable problem-description-box\"><h3>问题描述——<\/h3> <div class=\"problem-description\"><div style=\"text-align: left\"><div style=\"text-align: left\">安装客户端提示安装失败“aTrustAgent安装异常”，右下角提示“服务未启动”<br>\n<img id=\"aimg_G2yVy\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)  class=\"problem-description\"><div style=\"text-align: left\"><div style=\"text-align: left\">安装aTrust客户端显示检测到aTrustAgent安装异常，请退出后重新安装客户端！<br>\n<img id=\"aimg_j4L4E\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1648891339.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n<br>\n<\/div><\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>有效排查步骤——<\/h3> <div><div style=\"text-align: left\"><div style=\"text-align: left\">1、通过修复工具扫描显示服务未安装，无法正常修复，要求重新安装<div style=\"text-align: left\">2、退出防火墙和杀毒软件后，卸载重装客户端问题依旧<\/div><\/div><\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>告警信息——<\/h3> <div>&nbsp;<\/div><\/div><div class=\"mceNonEditable\"><h3>处理过程——<\/h3> <div>&nbsp;<\/div><\/div><div class=\"mceNonEditable\"><h3>根因——<\/h3> <div><div style=\"text-align: left\"><div style=\"text-align: left\">安装aTrust客户端过程中agent服务未正常拉起<\/div><\/div><\/div><\/div><div class=\"mceNonEditable problem-description-box\"><h3>解决方案——<\/h3> <div class=\"problem-description\"><div style=\"text-align: left\"><div style=\"text-align: left\">在C:\\Program Files(X86)\\Sangfor\\aTrust\\aTrustAgent运行cmd，输入atrustagent -i命令手动拉起测试正常<div style=\"text-align: left\"><img id=\"aimg_pcL22\" referrer=\"never\" onclick=\"zoom(this, this.src, 0, 0, 0)\" class=\"zoom\" data-src=\"https://bbs.sangfor.com.cn/data/attachment/thread/syncbbs-1648894918.png\" onmouseover=\"img_onmouseoverfunc(this)\" onload=\"thumbImg(this)\" border=\"0\" alt=\"\" style=\"max-width:100%;height:auto;border:1px solid #e3e6ec;border-radius:6px;margin:6px 0\" loading=\"lazy\"><br>\n<br>\n<\/div><\/div><\/div><\/div><\/div><div class=\"mceNonEditable\"><h3>建议与总结——<\/h3> <div>&nbsp;<\/div><\/div><\/div>","img":2},{"t":"【aTrust】aTrust2.2.10版本因Redis瞬时数据量超阈值，导致分布式集群DRC应用模块误告警","p":"零信任访问控制系统aTrust","m":"监控中心","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-08-14 19:57:08","id":"2:45482","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=45482&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>aTrust 2.2.10 SP3以下版本分布式集群节点因Redis瞬时数据量超100万阈值，触发DRC应用模块误告警及集群角色切换记录，涉及DRC模块与分布式集群，对业务无影响。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>告警信息：检测到分布式集群节点(本地数据中心)发生了DRC应用模块故障，请前往【系统管理】-【集群管理】-【分布式集群】排查或联系售后人员处理。管理员日志：集群角色切换，Details: Succeed to handle keepalived notify role changed to MASTER<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：aTrust2.2.10<\/li>\n<li>架构：通用架构<\/li>\n<li>部署模式：分布式集群<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<ol>\n<li>查看业务告警，确认DRC应用模块故障告警内容。<ul>\n<li>命令/路径：打开【监控中心】-【业务告警】<\/li>\n<li>预期结果：可看到检测到分布式集群节点发生了DRC应用模块故障的告警。<\/li>\n<li>判断依据：业务告警提示分布式集群节点发生DRC应用模块故障<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>查看分布式集群状态，确认集群是否正常。<ul>\n<li>命令/路径：打开【系统管理】-【集群管理】-【分布式集群】<\/li>\n<li>预期结果：集群状态显示正常，各节点无异常提示。<\/li>\n<li>判断依据：分布式集群页面各节点状态正常，无异常提示<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>查看管理员日志，确认集群角色切换记录。<ul>\n<li>命令/路径：打开【审计中心】-【日志中心】-【日志查看】-【管理员日志】<\/li>\n<li>预期结果：可看到SYSTEM操作者执行集群角色切换，操作结果成功。<\/li>\n<li>判断依据：管理员日志记录集群角色切换，详情：Succeed to handle keepalived notify role changed to MASTER<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>确认设备版本和部署方式。<ul>\n<li>命令/路径：打开【系统管理】-【升级管理】-【系统升级】<\/li>\n<li>预期结果：设备版本为v2.2.10，部署方式为虚拟化。<\/li>\n<li>判断依据：当前版本v2.2.10，包名SDP2.2.10.112 B Build20220926，虚拟化部署<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"5\">\n<li>结合版本与已知缺陷，确认DRC告警为Redis瞬时数据量超阈值导致的误告警。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：告警原因与已知缺陷吻合。<\/li>\n<li>判断依据：2.2.10 SP3及以下版本已知问题：redis数据量超过100w触发DRC告警，定时任务每30s清理，可能瞬时超标导致误告警<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>aTrust 2.2.10 SP3以下版本按内存设置redis数据量阈值（32G设备为100w），定时任务每30s清理一次，轮询间隔期间redis数据量瞬时超标，触发分布式集群DRC应用模块误告警及集群角色切换记录。属已知问题，对业务无影响。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：已确认设备版本为aTrust2.2.10 SP3以下，DRC告警对业务无影响，且告警原因为Redis瞬时数据量超阈值。<\/li>\n<li>是否后台操作：否<\/li>\n<li>操作步骤：\n<ol>\n<li>在【监控中心】-【业务告警】中忽略该DRC告警，状态设为“已忽略”（临时措施）<\/li>\n<li>维护窗口升级aTrust至2.2.10 SP3及以上版本（根治措施）<\/li>\n<\/ol>\n<\/li>\n<li>验证方案：忽略后无新DRC告警，集群正常，业务无影响；升级后告警不再出现。<\/li>\n<li>操作影响：忽略告警仅去除告警提示，不影响设备运行，业务不受影响。升级版本可能需重启设备，建议在业务低峰期进行。<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>补充说明<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>该问题为已知版本缺陷，Redis数据量瞬时超过阈值导致DRC误告警，不影响业务，无需紧急处理。升级至2.2.10 SP3及以上版本可彻底解决。<\/p>\n<\/div>\n<\/div>\n<\/div>","img":0},{"t":"【aTrust】因C:\\Program Files (x86)目录被微软限制，导致aTrust客户端安装失败，提示“检测到aTrustAgent安装异常”","p":"零信任访问控制系统aTrust","m":"","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-09-06 23:03:24","id":"2:47485","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=47485&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>Windows 10专业版下安装aTrust客户端，提示“检测到aTrustAgent安装异常，请退出后重新安装客户端”，安装失败。因C:\\Program Files (x86)目录被微软限制写入。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>安装失败：检测到aTrustAgent安装异常，请退出后重新安装客户端！文件路径：系统 (C:)\\用户&lt;用户名&gt;\\下载\\aTrustInstaller.exe；文件信息：名称aTrustInstaller，修改日期2026/6/18 11:28，类型应用程序，大小206,039 KB<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：aTrust2.2.16<\/li>\n<li>架构：通用架构<\/li>\n<li>部署模式：无需<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<ol>\n<li>查看客户端安装报错信息，获取具体错误提示。<ul>\n<li>命令/路径：在Windows资源管理器中以管理员身份运行aTrustInstaller.exe安装程序，观察安装进度。<\/li>\n<li>预期结果：安装程序弹出“检测到aTrustAgent安装异常”错误提示。<\/li>\n<li>判断依据：安装弹窗提示“检测到aTrustAgent安装异常，请退出后重新安装客户端”。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>确认终端操作系统版本信息。<ul>\n<li>命令/路径：以管理员身份打开CMD，执行 systeminfo 命令。<\/li>\n<li>预期结果：系统版本为Windows 10专业版 10.0.19045。<\/li>\n<li>判断依据：systeminfo显示OS为Microsoft Windows 10 专业版，版本10.0.19045 Build 19045。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>分析客户端无法安装的原因，确认C:\\Program Files (x86)目录限制问题。<ul>\n<li>命令/路径：无特定命令，通过后续符号链接验证确认。<\/li>\n<li>预期结果：确认微软对C:\\Program Files (x86)目录添加了限制。<\/li>\n<li>判断依据：创建符号链接重定向安装目录后，重新安装客户端成功，反向验证目录限制问题。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>微软对C:\\Program Files (x86)目录添加限制，导致aTrust客户端无法正常安装或运行，提示“检测到aTrustAgent安装异常，请退出后重新安装客户端”。<br>通过符号链接将安装目录重定向到其他盘符可解决。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：已确认终端系统为Windows 10专业版；需要以管理员身份运行CMD；若C:\\Program Files (x86)\\Sangfor目录已存在，建议先备份内容。<\/li>\n<li>是否后台操作：否<\/li>\n<li>操作步骤：\n<ol>\n<li>以管理员身份打开CMD。<\/li>\n<li>删除C:\\Program Files (x86)\\Sangfor目录（如存在）。<ul>\n<li>影响说明：删除前请确认目录中无重要文件，或先备份。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>在其他盘符（如D盘）创建目录D:\\Program Files (x86)\\Sangfor。<\/li>\n<li>执行命令：mklink /D \"C:\\Program Files (x86)\\Sangfor\" \"D:\\Program Files (x86)\\Sangfor\"<\/li>\n<li>重新安装aTrust客户端（以管理员身份运行aTrustInstaller.exe）。<\/li>\n<\/ol>\n<\/li>\n<li>验证方案：安装完成后，aTrust客户端正常启动，无报错提示。<\/li>\n<li>操作影响：实际将Sangfor目录重定向到其他盘符，若目标盘符空间不足需提前处理；该方案为临时处理方式，后续需在正式版本中解决。<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>补充说明<\/h3> \n<ul>\n<li>微软对C:\\Program Files (x86)目录的限制可能源于系统更新或安全策略变更，建议检查Windows更新记录。<\/li>\n<li>临时方案通过符号链接实现，不会影响其他软件的正常安装。<\/li>\n<\/ul>\n<\/div>\n<\/div>","img":0},{"t":"【aTrust】aTrust2.6.5因XDLA进程采集AI应用文件事件量过大导致CPU占满，用户办公卡顿","p":"零信任访问控制系统aTrust","m":"windows_客户端其他异常","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-08-10 21:20:50","id":"2:43865","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=43865&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>aTrust生长一体化客户端中XDLA进程（eaio_doctotext.exe等）在采集AI应用（OpenClaw、Qoder、CodeX）大量文件事件时，CPU占用率持续98.8%，导致办公卡顿。重启进程后短暂恢复，数分钟内再次占满。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>macOS活动监视器显示XDLA的esservice进程CPU占用率98.8%，后台无明显告警日志。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：aTrust2.6.5<\/li>\n<li>架构：通用架构<\/li>\n<li>部署模式：[单臂部署]<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<ol>\n<li>在macOS活动监视器中查看CPU占用情况，确认XDLA进程持续高负载。<ul>\n<li>命令/路径：打开macOS【活动监视器】，切换到【CPU】标签页，搜索XDLA或eaio相关进程。<\/li>\n<li>预期结果：XDLA的esservice进程CPU占用接近100%。<\/li>\n<li>判断依据：截图显示CPU占用98.8%，重启后数分钟内再次升高。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>通过aTrust控制台获取终端日志，分析文件事件采集量。<ul>\n<li>命令/路径：打开【业务管理】-【终端管理】-【终端日志获取】，选择对应终端并导出日志。<\/li>\n<li>预期结果：日志中频繁出现OpenClaw、Qoder、CodeX等AI应用的文件变更记录。<\/li>\n<li>判断依据：日志显示AI应用产生海量文件创建/修改事件，eaio_doctotext.exe持续处理。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>临时关闭XDLA相关进程或关闭AIO Service的完全磁盘访问权限，观察CPU占用变化。<ul>\n<li>命令/路径：在终端执行：killall eaio_doctotext.exe eaio_service.exe snac_agent.exe eaio_agent.exe printer_agent32.exe printer_agent64.exe 【第三方操作：以第三方设备实际情况为准】<\/li>\n<li>预期结果：CPU占用恢复正常（&lt;10%），办公卡顿消失，且不再反弹。<\/li>\n<li>判断依据：关闭进程后，活动监视器显示CPU占用降至低位，卡顿消除。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>XDLA进程（eaio_doctotext.exe等）监控磁盘文件变更，AI应用（OpenClaw、Qoder、CodeX）频繁创建/修改文件产生海量事件，导致CPU持续占满，终端响应缓慢。重启进程后事件队列再次涌入，无法根本缓解。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：终端为macOS系统，已安装aTrust生长一体化客户端。<\/li>\n<li>是否后台操作：否<\/li>\n<li>操作步骤：\n<ol>\n<li>关闭AIO Service的完全磁盘访问权限。<ul>\n<li>影响说明：关闭磁盘授权后XDLA无法监控文件事件，可能影响部分安全功能（如文件外发管控），但aTrust其他功能可正常使用。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>若CPU未下降，结束XDLA相关进程。<\/li>\n<li>在aTrust服务端将XDLA主进程添加至可信进程白名单。<ul>\n<li>影响说明：仅解决进程被误杀问题，不解决CPU占满的缺陷。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>等待830规则库发布（预计8.30上线），升级根治。<ul>\n<li>影响说明：升级过程不影响业务访问。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/li>\n<li>验证方案：关闭磁盘授权或结束进程后，MacOS活动监视器显示CPU占用降至10%以下，办公卡顿消除。长期方案生效后，重新授予磁盘权限，验证CPU正常。<\/li>\n<li>操作影响：临时方案会关闭XDLA的文件监控能力，但aTrust网络接入功能不受影响。长期方案为规则库修复，可彻底解决。<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>补充说明<\/h3> \n<ul>\n<li>XDLA是aTrust生长一体化客户端的数据防泄漏组件，负责文件事件采集与外发管控。<\/li>\n<li>若终端未启用AI应用但仍有类似高CPU问题，可排查其他高频文件操作软件（如版本控制系统、自动备份工具）。<\/li>\n<li>长期方案依赖规则库更新，具体版本号需关注官方发布包。<\/li>\n<\/ul>\n<\/div>\n<\/div>","img":0},{"t":"【aTrust】aTrust2.2.72因低版本EAIOWrapper模块缺陷导致core进程频繁重启，客户端登录提示ACL检测不到客户端","p":"零信任访问控制系统aTrust","m":"windows_客户端登录失败","v":"aTrust v2.5.16 ｜ 通用材料 ｜ aTrust v2.5.10 等 11 个版本","s":"通用","u":"2026-08-21 22:12:41","id":"2:46503","url":"https://support.sangfor.com.cn/cases/list?product_id=19&type=1&category_id=46503&isOpen=true","h":"<div class=\"case-tinymce-wrap\">\n<div class=\"mceNonEditable problem-description-box\"><h3>问题描述<\/h3> \n<div class=\"problem-description\" style=\"min-height: 40px;\">\n<p>首次aTrust登录失败，提示ACL检测不到客户端。根因：低版本（2.2.72）定制客户端EAIOWrapper模块缺陷，运行抛出abort信号致core进程频繁重启，影响ACL检测。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>告警信息<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>客户端登录提示：ACL检测不到客户端。<br>诊断修复工具报错，无法启动。<br>研发日志定位：低版本EAIOWrapper模块抛出abort信号导致进程退出。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>环境与版本信息<\/h3> \n<ul>\n<li>产品版本：aTrust2.2.72<\/li>\n<li>架构：通用架构<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>有效排查步骤<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<ol>\n<li>检查客户端core进程状态，确认是否频繁重启。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：core进程应稳定运行，不出现频繁退出重启。<\/li>\n<li>判断依据：core进程频繁重启，表明登录链路组件异常。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"2\">\n<li>运行客户端诊断修复工具，查看工具报错信息。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：诊断工具应能正常启动并输出修复结果。<\/li>\n<li>判断依据：诊断修复工具运行报错，无法启动，表明客户端组件异常。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"3\">\n<li>确认客户端版本信息，获取appversion和定制信息。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：客户端版本为aTrust2.2.72定制版。<\/li>\n<li>判断依据：客户端版本为aTrust2.2.72，定制信息含SDPC B Build20230704、ZTA B Build20230704等，确认为低版本定制客户端。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"4\">\n<li>切换高版本客户端验证core进程是否恢复稳定。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：高版本客户端下core进程不再重启。<\/li>\n<li>判断依据：切换高版本后core不再重启，但扫码登录仍提示ACL问题，说明core重启与客户端版本相关，且登录链路存在ACL对接问题。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<ol start=\"5\">\n<li>分析客户端日志，定位core进程退出原因。<ul>\n<li>命令/路径：无<\/li>\n<li>预期结果：找到core进程退出的具体代码模块和信号。<\/li>\n<li>判断依据：定位低版本EAIOWrapper模块抛出abort信号致进程退出，高版本EAIO已修复该问题。<\/li>\n<\/ul><\/li>\n<\/ol>\n\n<\/div>\n<\/div>\n<div class=\"mceNonEditable\"><h3>根因<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>低版本EAIOWrapper模块缺陷导致运行中抛出abort信号，core进程频繁退出重启，进而ACL检测不到客户端、登录失败。<br>临时清除该组件登录恢复，确认根因为EAIOWrapper缺陷，而非aTrust平台配置错误。<\/p>\n<\/div>\n<\/div>\n<div class=\"mceNonEditable problem-description-box\"><h3>解决方案<\/h3> \n<ul>\n<li>前置条件：已定位根因为低版本EAIOWrapper模块缺陷；具备客户端操作权限及管理员配合。<\/li>\n<li>是否后台操作：否<\/li>\n<li>操作步骤：\n<ol>\n<li>临时清除低版本EAIOWrapper组件，解决core进程频繁重启。【临时方案】<\/li>\n<li>确认core进程重启问题消除。<\/li>\n<li>对接管理员处理ACL问题。【第三方操作：以第三方设备实际情况为准】<\/li>\n<li>ACL问题处理后，扫码登录验证，确认登录正常。<\/li>\n<li>建议后续升级客户端至更高版本，根治低版本EAIOWrapper模块缺陷。<\/li>\n<\/ol>\n<\/li>\n<li>验证方案：临时清除EAIOWrapper后core进程不再重启；管理员处理ACL后，扫码登录正常，业务访问恢复正常。<\/li>\n<li>操作影响：临时清除EAIOWrapper组件后客户端登录恢复正常；该组件为低版本客户端组件，清除后可能影响相关功能，建议后续升级客户端版本根治。<\/li>\n<\/ul>\n<\/div>\n<div class=\"mceNonEditable\"><h3>补充说明<\/h3> \n<div class=\"\" style=\"min-height: 40px;\">\n<p>临时清除组件存在功能影响风险，升级客户端至稳定版本是根治此问题的唯一方法。<\/p>\n<\/div>\n<\/div>\n<\/div>","img":0}]</script>
<script>
var DATA = JSON.parse(document.getElementById('sfc-data').textContent);
DATA.forEach(function(d,i){ d._i = i; d._s = (d.t+' '+d.p+' '+d.m+' '+d.id).toLowerCase(); });

var st = { q: '', page: 1, size: 20, all: false, lazy: true };
var CARD_CACHE = {}, CARD_N = 0, TOC_MAX = 400;
var IMG_OBS = null, BODY_OBS = null, searchTimer = null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hl(s){
var t = esc(s);
if(!st.q) return t;
try{ return t.replace(new RegExp('('+st.q.replace(/[.*+?^${}()|[]\]/g,'\$&')+')','gi'),'<mark>$1</mark>') }catch(e){ return t }
}
/* 搜索索引在加载时一次性算好，避免每次输入都重新拼接/转小写 */
function filtered(){
if(!st.q) return DATA;
var q = st.q.toLowerCase();
return DATA.filter(function(d){ return d._s.indexOf(q) >= 0 });
}
function pages(){ return st.all ? 1 : Math.max(1, Math.ceil(filtered().length / st.size)) }
function metaOf(d){
var ml = [d.p?'产品线：'+esc(d.p):'', d.m?'模块：'+esc(d.m):'', d.v?'适用版本：'+esc(d.v):'',
          d.s?'架构：'+esc(d.s):'', d.u?'更新：'+esc(d.u):''].filter(Boolean).join(' ｜ ');
return (ml ? '<div>' + ml + '</div>' : '') +
  '<div>案例ID：' + esc(d.id) +
  (d.url ? ' ｜ <a href="' + esc(d.url) + '" target="_blank" rel="noopener">在官网打开 ↗</a>' : '') +
  '</div>';
}

/* ------------------------------------------------------------------
 * 性能：正文与图片都不再一次性塞进 DOM
 *  - 卡片骨架（标题+元信息）先渲染，正文等卡片接近视口才注入
 *  - 图片等接近视口才设置 src，避免上百张图同时解码
 *  - 注入按帧分批，避免一次 innerHTML 阻塞主线程
 * ------------------------------------------------------------------ */
function observeImages(root){
var imgs = root.querySelectorAll('img[data-src]');
for(var i=0;i<imgs.length;i++){
  if(IMG_OBS){ IMG_OBS.observe(imgs[i]); }
  else { var s = imgs[i].getAttribute('data-src'); if(s){ imgs[i].src = s; imgs[i].removeAttribute('data-src'); } }
}
}
function fillBody(node, d){
if(!node || node._filled || !d) return;
node._filled = true;
node.innerHTML = d.h;
observeImages(node);
}
function injectChunked(arts, start, step){
if(!arts || start >= arts.length) return;
var end = Math.min(arts.length, start + (step || 4));
for(var i=start;i<end;i++){
  var a = arts[i];
  if(a && a._body) fillBody(a._body, a._d);
}
if(end < arts.length) requestAnimationFrame(function(){ injectChunked(arts, end, step) });
}
function initObservers(){
if(typeof IntersectionObserver === 'undefined') return;
IMG_OBS = new IntersectionObserver(function(es){
  for(var i=0;i<es.length;i++){
    var e = es[i];
    if(!e.isIntersecting) continue;
    var im = e.target, src = im.getAttribute('data-src');
    if(src){ im.src = src; im.removeAttribute('data-src'); }
    IMG_OBS.unobserve(im);
  }
}, { rootMargin: '600px 0px' });
BODY_OBS = new IntersectionObserver(function(es){
  var hit = [];
  for(var i=0;i<es.length;i++){
    var e = es[i];
    if(!e.isIntersecting) continue;
    BODY_OBS.unobserve(e.target);
    hit.push(e.target);
  }
  if(hit.length) injectChunked(hit, 0, 4);
}, { rootMargin: '700px 0px' });
}
function clearCardCache(){
for(var k in CARD_CACHE){
  var o = CARD_CACHE[k];
  if(o && BODY_OBS){ try{ BODY_OBS.unobserve(o) }catch(e){} }
}
CARD_CACHE = {}; CARD_N = 0;
}
function newCard(d){
var el = document.createElement('article');
el.className = 'case';
el.innerHTML = '<h2></h2><div class="meta"></div><div class="body"></div>';
el._h2 = el.children[0]; el._meta = el.children[1]; el._body = el.children[2];
el._d = d;
el._meta.innerHTML = metaOf(d);
return el;
}
/* 卡片 DOM 复用：翻回上一页时直接搬回来，不重新解析正文、图片也不闪 */
function cardOf(d, idx){
var el = CARD_CACHE[d._i];
if(!el){
  el = newCard(d);
  if(CARD_N > 260) clearCardCache();
  CARD_CACHE[d._i] = el; CARD_N++;
}
el.id = 'case-' + (idx + 1);
el._h2.innerHTML = (idx + 1) + '. ' + hl(d.t);
return el;
}
function setupCards(box){
var arr = Array.prototype.slice.call(box.querySelectorAll('article.case'));
if(!arr.length) return;
if(!st.lazy || !BODY_OBS){ injectChunked(arr, 0, 20); return; }
for(var i=0;i<arr.length;i++){
  var a = arr[i];
  if(a._body && !a._body._filled) BODY_OBS.observe(a);
}
}
function render(){
var all = filtered();
if(st.page > pages()) st.page = pages();
if(st.page < 1) st.page = 1;
var start = st.all ? 0 : (st.page-1)*st.size;
var end = st.all ? all.length : Math.min(all.length, start + st.size);
var slice = all.slice(start, end);

var box = document.getElementById('list');
var toc = document.getElementById('toc');

if(!slice.length){
  box.textContent = '';
  box.innerHTML = '<div class="empty">没有匹配的案例</div>';
  toc.style.display = 'none';
} else {
  var frag = document.createDocumentFragment();
  var tl = [];
  for(var i=0;i<slice.length;i++){
    var d = slice[i], no = start + i + 1;
    frag.appendChild(cardOf(d, start + i));
    if(i < TOC_MAX) tl.push('<li><a href="#case-' + no + '">' + no + '. ' + esc(d.t.slice(0,44)) + '</a></li>');
  }
  box.textContent = '';
  box.appendChild(frag);
  toc.style.display = '';
  toc.innerHTML = '<h3>本页目录' +
    (st.all ? '（全部）' : '（第 ' + (start+1) + '-' + end + ' 条，共 ' + all.length + ' 条）') +
    '</h3><ol>' + tl.join('') + '</ol>' +
    (slice.length > TOC_MAX ? '<div class="tocmore">… 目录仅列出前 ' + TOC_MAX + ' 条，共 ' + slice.length + ' 条</div>' : '');
  setupCards(box);
}

document.getElementById('info').textContent =
  (all.length === 0 ? '共 0 条'
    : st.all ? '全部 ' + all.length + ' 条'
    : '第 ' + (start + 1) + '-' + end + ' 条 / 共 ' + all.length + ' 条')
  + (st.q ? '（已搜索「' + st.q + '」）' : '');
var last = st.all || st.page >= pages();
document.getElementById('b-first').disabled = st.all || st.page <= 1;
document.getElementById('b-prev').disabled  = st.all || st.page <= 1;
document.getElementById('b-next').disabled  = last;
document.getElementById('b-last').disabled  = last;
syncAllBtn();
try { window.scrollTo(0, 0); } catch (e) {}
}
function syncAllBtn(){
var b = document.getElementById('b-all');
if(!b) return;
b.textContent = st.all ? '⤡ 收起（回到分页）' : '展开全部（便于打印）';
}
function go(p){ st.page = p; render() }
function onSearch(v){
st.q = (v||'').trim(); st.page = 1; st.all = false; st.lazy = true;
clearTimeout(searchTimer);
searchTimer = setTimeout(render, 220); /* 输入防抖，避免逐字重建 DOM */
}
function setSize(v){ st.size = parseInt(v,10)||20; st.page = 1; st.all = false; st.lazy = true; render() }
function toggleAll(){
if(st.all){ st.all = false; st.lazy = true; render(); return; }
var n = filtered().length;
if(n > 600 && !confirm('共 ' + n + ' 条，展开全部将一次性渲染所有正文，可能较慢。\n建议仅在小批量或打印前使用。是否继续？')) return;
st.all = true; st.lazy = false; render();
}
/* 直接 Ctrl+P 时，把当前页尚未注入的正文补齐，避免打印出空白 */
window.addEventListener('beforeprint', function(){
if(!st.lazy) return;
var arr = document.querySelectorAll('#list article.case');
for(var i=0;i<arr.length;i++) fillBody(arr[i]._body, arr[i]._d);
});
document.addEventListener('keydown', function(e){
if(e.target && e.target.tagName === 'INPUT') return;
if(e.key === 'ArrowRight' && !document.getElementById('b-next').disabled) go(st.page+1);
if(e.key === 'ArrowLeft'  && !document.getElementById('b-prev').disabled) go(st.page-1);
});
initObservers();
render();
</script>
