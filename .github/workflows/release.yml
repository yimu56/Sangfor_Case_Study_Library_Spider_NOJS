name: build-release

# 打 tag（如 v2.0.0）时自动编译并附到 Release 上，
# 这样普通用户只需要在 Releases 页下载一个 exe 即可，无需任何运行环境。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: 静态检查
        run: go vet ./...

      - name: 编译
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags="-H windowsgui -s -w" -o sangfor-case-exporter.exe .
          Get-Item sangfor-case-exporter.exe | Select-Object Name, Length

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sangfor-case-exporter.exe
          generate_release_notes: true
          body: |
            深信服案例库导出工具 — 单文件、免安装、双击即用。

            下载下面的 `sangfor-case-exporter.exe` 直接运行即可，不需要浏览器插件，
            不需要脚本管理器，也不需要 Python / Node 运行环境。
            详细用法见 [README](https://github.com/${{ github.repository }}#使用步骤)。
